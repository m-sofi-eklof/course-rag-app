# Local dev only. Production uses Supabase/Neon free tier for Postgres
# and Cloudflare R2 instead of these containers.
# See AGENTS.md for budget constraints.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: course-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: course_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Local S3-compatible object store — mirrors Cloudflare R2 for dev.
  # In prod, point R2_ENDPOINT_URL at your real R2 account endpoint instead.
  minio:
    image: minio/minio:latest
    container_name: course-rag-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web console (http://localhost:9001)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket on first start so the app can upload immediately
  minio-init:
    image: minio/mc:latest
    container_name: course-rag-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/course-rag &&
        echo 'Bucket ready.'
      "

volumes:
  pgdata:
  minio_data:
